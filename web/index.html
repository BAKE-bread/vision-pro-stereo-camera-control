<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stereo Studio · 无设备实验台</title><link rel="stylesheet" href="/web/style.css"></head>
<body><header><div><small>STEREO STUDIO / DEVICE LAB</small><h1>从双目画面，到空间感知。</h1><p>模拟相机 · 远程视角 · 深度测量</p></div><span id="status" role="status">正在连接</span></header>
<main><section class="viewer"><div class="section-head"><h2>左目观察窗</h2><span id="frame">等待画面</span></div><div class="image-wrap"><img id="preview" alt="模拟双目相机左目画面，点击画面测距"><canvas id="overlay"></canvas></div><p id="measure" aria-live="polite">点击画面中的物体，测量相机到该位置的距离。</p><div class="legend"><span>近</span><i></i><span>远</span><label><input id="heat" type="checkbox">叠加深度热图</label></div></section>
<aside><section><h2>视角控制</h2><p>拖动滑块模拟头部转动。停止控制后，云台保持当前位置。</p><label>水平角 <output id="yawValue">0°</output><input id="yaw" type="range" min="-70" max="70" value="0"></label><label>俯仰角 <output id="pitchValue">0°</output><input id="pitch" type="range" min="-35" max="35" value="0"></label><div class="actions"><button id="control">开始控制</button><button id="release" class="secondary" disabled>停止</button></div><p id="controlStatus" role="status">未取得控制权</p></section>
<section><h2>深度概览</h2><div class="metrics"><div><small>中心区域近端深度</small><strong id="near">—</strong></div><div><small>有效数据</small><strong id="valid">—</strong></div></div><p id="warning">深度为模拟数据</p></section>
<section><h2>连接设置</h2><label>访问令牌<input id="token" type="password" autocomplete="off" placeholder="本机演示可留空"></label><button id="reconnect" class="secondary">重新连接</button><p>令牌只保留在此页面内存中。</p></section></aside>
<section class="player"><h2>网络视频测试</h2><p>验证 App 播放器使用的 HTTP 视频地址。浏览器 HLS 支持取决于平台；生成的 MP4 可直接预览。</p><div class="actions"><input id="videoURL" type="url" placeholder="http://127.0.0.1:8765/media/demo.mp4"><button id="loadVideo">播放地址</button></div><video id="video" controls preload="metadata"></video><p id="videoError" role="status"></p></section></main><footer>模拟环境仅用于功能联调。深度提示不用于安全避障。</footer><script src="/web/app.js"></script></body></html>
